<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="저녁 창가 책상에서 시험을 준비하는 장면 그림">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5faff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#eaf4fc"/>
      <stop offset="1" stop-color="#dcecf9"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset=".55" stop-color="#2f6fa3"/>
      <stop offset="1" stop-color="#8cc8ec"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f7fb"/>
      <stop offset="1" stop-color="#dfe9f2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a44"/>
      <stop offset="1" stop-color="#173f63"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r="1">
      <stop offset="0" stop-color="#fff6d6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b2a45" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- 벽 -->
  <rect width="900" height="700" fill="url(#wall)"/>

  <!-- 창 (저녁 도시) -->
  <g>
    <rect x="430" y="70" width="400" height="330" rx="14" fill="url(#dusk)"/>
    <!-- 별·달 -->
    <circle cx="760" cy="118" r="14" fill="#f4f1de" opacity=".9"/>
    <circle cx="766" cy="114" r="12" fill="#1e3a5f"/>
    <g fill="#ffffff" opacity=".7"><circle cx="520" cy="110" r="1.6"/><circle cx="610" cy="96" r="1.2"/><circle cx="690" cy="140" r="1.4"/><circle cx="580" cy="150" r="1"/></g>
    <!-- 도시 실루엣 -->
    <g fill="#14304d">
      <rect x="430" y="300" width="46" height="100"/>
      <rect x="470" y="262" width="38" height="138"/>
      <rect x="504" y="286" width="54" height="114"/>
      <rect x="556" y="236" width="34" height="164"/>
      <rect x="588" y="276" width="62" height="124"/>
      <rect x="648" y="250" width="40" height="150"/>
      <rect x="686" y="292" width="58" height="108"/>
      <rect x="742" y="228" width="36" height="172"/>
      <rect x="776" y="282" width="54" height="118"/>
    </g>
    <g fill="#ffd98a" opacity=".85">
      <rect x="478" y="276" width="6" height="8"/><rect x="492" y="300" width="6" height="8"/><rect x="562" y="252" width="6" height="8"/><rect x="574" y="290" width="6" height="8"/>
      <rect x="600" y="292" width="6" height="8"/><rect x="624" y="318" width="6" height="8"/><rect x="656" y="266" width="6" height="8"/><rect x="668" y="300" width="6" height="8"/>
      <rect x="750" y="246" width="6" height="8"/><rect x="760" y="282" width="6" height="8"/><rect x="788" y="300" width="6" height="8"/><rect x="514" y="320" width="6" height="8"/>
    </g>
    <!-- 창틀 -->
    <rect x="430" y="70" width="400" height="330" rx="14" fill="none" stroke="#ffffff" stroke-width="12"/>
    <line x1="630" y1="76" x2="630" y2="396" stroke="#ffffff" stroke-width="9"/>
    <rect x="414" y="398" width="432" height="14" rx="4" fill="#ffffff"/>
  </g>

  <!-- 벽 선반 + 교재 -->
  <g filter="url(#sh)">
    <rect x="250" y="190" width="150" height="10" rx="3" fill="#ffffff"/>
    <rect x="262" y="120" width="20" height="70" rx="2" fill="#0369a1"/>
    <rect x="284" y="128" width="16" height="62" rx="2" fill="#94a3b8"/>
    <rect x="302" y="114" width="22" height="76" rx="2" fill="#1e3a5f"/>
    <rect x="326" y="132" width="16" height="58" rx="2" fill="#38bdf8"/>
    <rect x="344" y="138" width="44" height="52" rx="2" fill="#e2e8f0" transform="rotate(-14 366 190)"/>
  </g>

  <!-- 책상 -->
  <rect x="150" y="470" width="750" height="24" fill="url(#deskTop)"/>
  <rect x="150" y="494" width="750" height="206" fill="#cfdeea"/>
  <rect x="150" y="494" width="750" height="8" fill="#b9cddd"/>

  <!-- 스탠드 + 빛 -->
  <g>
    <path d="M330 470 L330 330 L410 262" fill="none" stroke="#1e3a5f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="300" y="462" width="60" height="10" rx="5" fill="#1e3a5f"/>
    <path d="M392 246 l56 22 l-16 26 l-52 -18 z" fill="#1e3a5f"/>
    <path d="M416 290 L360 470 L560 470 Z" fill="url(#glow)" opacity=".55"/>
  </g>

  <!-- 노트북 -->
  <g filter="url(#sh)">
    <path d="M560 470 L860 470 L878 482 L542 482 Z" fill="#cbd5e1"/>
    <rect x="574" y="312" width="272" height="160" rx="10" fill="#e2e8f0"/>
    <rect x="584" y="322" width="252" height="140" rx="6" fill="url(#screen)"/>
    <!-- 화면: 성적 그래프 -->
    <g stroke="#1f5580" stroke-width="1">
      <line x1="604" y1="360" x2="816" y2="360"/><line x1="604" y1="390" x2="816" y2="390"/><line x1="604" y1="420" x2="816" y2="420"/>
    </g>
    <polyline points="606,438 646,424 686,428 726,400 766,384 810,350" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#38bdf8"><circle cx="726" cy="400" r="4.5"/><circle cx="766" cy="384" r="4.5"/><circle cx="810" cy="350" r="5.5" fill="#7dd3fc"/></g>
    <rect x="604" y="334" width="70" height="8" rx="4" fill="#5b7fa3"/>
  </g>

  <!-- 문제집 (수식·그래프) -->
  <g filter="url(#sh)" transform="rotate(-4 360 540)">
    <rect x="200" y="470" width="300" height="140" rx="6" fill="#ffffff"/>
    <rect x="350" y="470" width="2" height="140" fill="#e2e8f0"/>
    <!-- 왼쪽 쪽: 수식 줄 -->
    <text x="218" y="502" font-family="'Times New Roman', serif" font-style="italic" font-size="17" fill="#1e3a5f">f(x) = x² − 4x + 3</text>
    <g stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
      <line x1="218" y1="522" x2="330" y2="522"/><line x1="218" y1="540" x2="318" y2="540"/><line x1="218" y1="558" x2="334" y2="558"/><line x1="218" y1="576" x2="300" y2="576"/>
    </g>
    <circle cx="226" cy="594" r="7" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <!-- 오른쪽 쪽: 좌표·포물선 -->
    <line x1="368" y1="584" x2="484" y2="584" stroke="#94a3b8" stroke-width="2"/>
    <line x1="388" y1="488" x2="388" y2="598" stroke="#94a3b8" stroke-width="2"/>
    <path d="M396 500 Q 430 640 468 500" fill="none" stroke="#0284c7" stroke-width="3"/>
    <rect x="404" y="548" width="60" height="10" rx="2" fill="#fde047" opacity=".55"/>
  </g>

  <!-- D-30 메모 -->
  <g transform="rotate(5 470 210)" filter="url(#sh)">
    <rect x="440" y="168" width="84" height="76" rx="4" fill="#fef3c7"/>
    <text x="482" y="216" text-anchor="middle" font-family="Pretendard, -apple-system, 'Malgun Gothic', sans-serif" font-size="26" font-weight="800" fill="#1e3a5f">D-30</text>
    <rect x="456" y="226" width="52" height="4" rx="2" fill="#f59e0b" opacity=".6"/>
  </g>

  <!-- 플래너 -->
  <g filter="url(#sh)" transform="rotate(6 640 560)">
    <rect x="560" y="510" width="150" height="104" rx="6" fill="#1e3a5f"/>
    <rect x="570" y="518" width="130" height="88" rx="4" fill="#f8fafc"/>
    <g fill="none" stroke="#0284c7" stroke-width="2">
      <rect x="580" y="530" width="10" height="10" rx="2"/><rect x="580" y="552" width="10" height="10" rx="2"/><rect x="580" y="574" width="10" height="10" rx="2"/>
    </g>
    <path d="M582 535 l3 3 l6 -7 M582 557 l3 3 l6 -7" fill="none" stroke="#0284c7" stroke-width="2.4" stroke-linecap="round"/>
    <g stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"><line x1="598" y1="535" x2="680" y2="535"/><line x1="598" y1="557" x2="668" y2="557"/><line x1="598" y1="579" x2="686" y2="579"/></g>
  </g>

  <!-- 샤프·형광펜 -->
  <g transform="rotate(-18 520 640)">
    <rect x="452" y="628" width="130" height="9" rx="4" fill="#334155"/>
    <rect x="452" y="628" width="26" height="9" rx="3" fill="#94a3b8"/>
    <path d="M582 628 L598 632.5 L582 637 Z" fill="#cbd5e1"/>
  </g>
  <g transform="rotate(12 790 600)">
    <rect x="730" y="590" width="110" height="20" rx="8" fill="#ffffff"/>
    <rect x="818" y="590" width="30" height="20" rx="6" fill="#facc15"/>
  </g>

  <!-- 텀블러 -->
  <g filter="url(#sh)">
    <rect x="770" y="412" width="44" height="72" rx="10" fill="#e2e8f0" transform="translate(70 0)"/>
    <rect x="840" y="404" width="44" height="14" rx="6" fill="#1e3a5f"/>
  </g>
</svg>
