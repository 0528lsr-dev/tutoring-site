<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="학생이 노트북으로 선생님과 1:1 화상 수업을 하는 장면 그림">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5faff" stop-opacity="0"/>
      <stop offset=".38" stop-color="#eef6fd"/>
      <stop offset="1" stop-color="#e2f0fb"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd6f7"/>
      <stop offset="1" stop-color="#dff2fd"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="1" stop-color="#dde8f1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#bfe3f9"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25466b"/>
      <stop offset="1" stop-color="#1b3554"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0b2a45" flood-opacity=".14"/>
    </filter>
  </defs>

  <!-- 벽 -->
  <rect width="900" height="700" fill="url(#wall)"/>

  <!-- 창 (맑은 낮) -->
  <g>
    <rect x="540" y="56" width="340" height="250" rx="14" fill="url(#sky)"/>
    <g fill="#ffffff" opacity=".95">
      <ellipse cx="610" cy="118" rx="34" ry="13"/><ellipse cx="634" cy="108" rx="24" ry="16"/>
      <ellipse cx="800" cy="170" rx="30" ry="11"/><ellipse cx="820" cy="161" rx="20" ry="13"/>
    </g>
    <g fill="#b9dcf2">
      <rect x="548" y="250" width="40" height="56"/><rect x="586" y="232" width="30" height="74"/><rect x="614" y="258" width="46" height="48"/>
      <rect x="760" y="240" width="34" height="66"/><rect x="792" y="226" width="44" height="80"/><rect x="834" y="256" width="40" height="50"/>
    </g>
    <rect x="540" y="56" width="340" height="250" rx="14" fill="none" stroke="#ffffff" stroke-width="12"/>
    <line x1="710" y1="62" x2="710" y2="300" stroke="#ffffff" stroke-width="9"/>
  </g>

  <!-- 떠 있는 카드: 내신 대비 체크리스트 -->
  <g filter="url(#sh)">
    <rect x="370" y="78" width="210" height="132" rx="16" fill="#ffffff"/>
    <text x="392" y="112" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="19" font-weight="800" fill="#0c4a6e">내신 대비</text>
    <g fill="none" stroke="#0284c7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="392" y="128" width="16" height="16" rx="4"/><path d="M395.5 136 l3.5 3.5 l6 -7"/>
      <rect x="392" y="154" width="16" height="16" rx="4"/><path d="M395.5 162 l3.5 3.5 l6 -7"/>
      <rect x="392" y="180" width="16" height="16" rx="4"/>
    </g>
    <g stroke="#d6e6f2" stroke-width="7" stroke-linecap="round">
      <line x1="420" y1="136" x2="548" y2="136"/><line x1="420" y1="162" x2="530" y2="162"/><line x1="420" y1="188" x2="540" y2="188"/>
    </g>
  </g>

  <!-- 떠 있는 카드: 외국어 -->
  <g filter="url(#sh)">
    <rect x="398" y="236" width="168" height="66" rx="33" fill="#ffffff"/>
    <g font-family="Pretendard, 'Malgun Gothic', 'Microsoft YaHei', 'Yu Gothic', sans-serif" font-size="21" font-weight="800" text-anchor="middle">
      <circle cx="434" cy="269" r="21" fill="#e0f2fe"/><text x="434" y="276" fill="#0369a1">A</text>
      <circle cx="482" cy="269" r="21" fill="#fde8e8"/><text x="482" y="276" fill="#b91c1c">中</text>
      <circle cx="530" cy="269" r="21" fill="#fff3d6"/><text x="530" y="276" fill="#b45309">あ</text>
    </g>
  </g>

  <!-- 떠 있는 카드: 성적 그래프 (창 위) -->
  <g filter="url(#sh)">
    <rect x="726" y="96" width="140" height="96" rx="14" fill="#ffffff"/>
    <g stroke="#e6eef5" stroke-width="2"><line x1="742" y1="128" x2="850" y2="128"/><line x1="742" y1="154" x2="850" y2="154"/></g>
    <polyline points="744,176 772,164 800,168 826,140 848,118" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="848" cy="118" r="6" fill="#22c55e"/>
  </g>

  <!-- 책상 -->
  <rect x="290" y="470" width="610" height="22" fill="url(#desk)"/>
  <rect x="290" y="492" width="610" height="208" fill="#cfdeea"/>
  <rect x="290" y="492" width="610" height="7" fill="#bccfdf"/>

  <!-- 교재 더미 -->
  <g filter="url(#sh)">
    <rect x="312" y="444" width="128" height="26" rx="4" fill="#0284c7"/>
    <rect x="320" y="418" width="116" height="26" rx="4" fill="#1e3a5f"/>
    <rect x="308" y="392" width="122" height="26" rx="4" fill="#7dd3fc"/>
    <g font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14" font-weight="800" fill="#ffffff">
      <text x="326" y="462">수학</text><text x="334" y="436">국어</text><text x="322" y="410" fill="#0c4a6e">영어</text>
    </g>
  </g>

  <!-- 노트북 (화상 수업 중) -->
  <g filter="url(#sh)">
    <path d="M590 470 L870 470 L888 482 L572 482 Z" fill="#cbd5e1"/>
    <rect x="604" y="316" width="252" height="156" rx="10" fill="#e2e8f0"/>
    <rect x="613" y="325" width="234" height="138" rx="6" fill="url(#screen)"/>
    <!-- 화면 속 선생님(얼굴 표정 없이 단순하게) -->
    <path d="M688 463 q0 -46 42 -46 q42 0 42 46 z" fill="#0369a1"/>
    <circle cx="730" cy="388" r="24" fill="#f1c9a5"/>
    <path d="M706 386 q2 -30 26 -30 q24 0 24 28 q-10 -14 -50 2 z" fill="#1f2937"/>
    <path d="M704 392 a27 27 0 0 1 52 0" fill="none" stroke="#0f172a" stroke-width="3.5"/>
    <rect x="700" y="388" width="8" height="14" rx="3" fill="#0f172a"/>
    <!-- 화면 위 표시 -->
    <rect x="622" y="334" width="62" height="22" rx="11" fill="#0284c7"/>
    <text x="653" y="350" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" font-weight="800" fill="#ffffff">1:1 수업</text>
    <circle cx="830" cy="345" r="6" fill="#ef4444"/>
  </g>

  <!-- 학생 (뒷모습) -->
  <g>
    <!-- 몸통(교복 재킷) -->
    <path d="M440 640 L452 432 q4 -30 34 -36 l40 -6 q30 0 62 6 q30 6 34 36 L676 640 Z" fill="url(#blazer)"/>
    <!-- 목·머리 -->
    <rect x="522" y="360" width="28" height="36" rx="10" fill="#e8b994"/>
    <circle cx="536" cy="336" r="46" fill="#1f2937"/>
    <ellipse cx="489" cy="342" rx="7" ry="11" fill="#e8b994"/>
    <ellipse cx="583" cy="342" rx="7" ry="11" fill="#e8b994"/>
    <path d="M492 320 q44 -40 88 0" fill="none" stroke="#374151" stroke-width="5" stroke-linecap="round" opacity=".6"/>
    <!-- 오른팔(책상 위로) -->
    <path d="M640 452 q34 4 46 26 l-14 10 q-16 -14 -40 -14 z" fill="#25466b"/>
    <ellipse cx="682" cy="482" rx="13" ry="8" fill="#e8b994"/>
  </g>

  <!-- 의자 등받이 -->
  <rect x="478" y="520" width="118" height="180" rx="20" fill="#0c2a3f"/>
  <rect x="490" y="532" width="94" height="10" rx="5" fill="#1e4a6e"/>

  <!-- 수능 OMR 답안지 -->
  <g filter="url(#sh)" transform="rotate(-8 790 560)">
    <rect x="712" y="504" width="164" height="112" rx="8" fill="#ffffff"/>
    <rect x="712" y="504" width="164" height="26" rx="8" fill="#fee2e2"/>
    <text x="724" y="523" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14" font-weight="800" fill="#b91c1c">수능 · 모의고사</text>
    <g fill="none" stroke="#fca5a5" stroke-width="1.8">
      <circle cx="736" cy="550" r="6"/><circle cx="756" cy="550" r="6"/><circle cx="776" cy="550" r="6"/><circle cx="796" cy="550" r="6"/>
      <circle cx="736" cy="572" r="6"/><circle cx="756" cy="572" r="6"/><circle cx="776" cy="572" r="6"/><circle cx="796" cy="572" r="6"/>
      <circle cx="736" cy="594" r="6"/><circle cx="756" cy="594" r="6"/><circle cx="776" cy="594" r="6"/><circle cx="796" cy="594" r="6"/>
    </g>
    <g fill="#1f2937"><circle cx="756" cy="550" r="5"/><circle cx="796" cy="572" r="5"/><circle cx="736" cy="594" r="5"/></g>
    <rect x="818" y="544" width="44" height="58" rx="4" fill="#f1f5f9"/>
  </g>

  <!-- 샤프 -->
  <g transform="rotate(-16 640 640)">
    <rect x="580" y="634" width="112" height="9" rx="4" fill="#334155"/>
    <path d="M692 634 L706 638.5 L692 643 Z" fill="#cbd5e1"/>
  </g>
</svg>
