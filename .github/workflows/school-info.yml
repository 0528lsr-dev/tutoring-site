# 학교별 학사일정·급식 페이지(pages/*-학교정보.html) 매주 자동 갱신 (2026-11-26)
# 나이스 교육정보 개방포털에서 새로 받고(생성기 neis.py) → 학교 정보 페이지만 다시 써서 → 이 저장소에 올린다.
# 비밀값: NEIS_KEY(나이스 인증키), GEN_TOKEN(비공개 생성기 저장소 0528lsr-dev/tutoring-generator 읽기용)
name: 학교 정보 매주 갱신
on:
  schedule:
    - cron: '0 18 * * 0'    # 매주 월요일 03:00 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency: school-info
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: 사이트 (학교 정보 페이지만)
        uses: actions/checkout@v4
        with:
          path: out/tutoring-site
          sparse-checkout: |
            /pages/*-학교정보.html
          sparse-checkout-cone-mode: false
      - name: 생성기
        uses: actions/checkout@v4
        with:
          repository: 0528lsr-dev/tutoring-generator
          token: ${{ secrets.GEN_TOKEN }}
          path: gen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 나이스에서 학교 정보 받기
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          PYTHONIOENCODING: utf-8
        run: python gen/neis.py
      - name: 학교 정보 페이지 다시 쓰기
        env:
          INFO_ONLY: '1'
          ONLY: tutoring-site
        run: node gen/run.js "$GITHUB_WORKSPACE/out"
      - name: 올리기
        working-directory: out/tutoring-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pages
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -q -m "학교 정보 매주 갱신 $(TZ=Asia/Seoul date +%F) (나이스 학사일정·급식)"
          for i in 1 2 3; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; done
