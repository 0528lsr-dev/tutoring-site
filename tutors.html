<main class="wrap">
  <div class="page-hero">
    <small>TUTORS</small>
    <h1>우리 아이에게 맞는 선생님을 찾아보세요</h1>
    <p>과목·수업형태·지역으로 검색할 수 있습니다. 방문 수업과 화상 수업 모두 가능합니다.</p>
  </div>

  <form class="tsearch" id="tutor-search">
    <input id="tutor-q" type="search" placeholder="🔍 과목·지역·선생님으로 검색 (예: 수학 분당 · 영어 화상 · 부산)" aria-label="선생님 검색">

  </form>

  <div class="filters">
    <div class="filter-row" data-key="mode">
      <span class="filter-label">수업형태</span>
      <div class="chips">
        <button class="chip" data-value="">전체</button>
        <button class="chip" data-value="방문">방문</button>
        <button class="chip" data-value="화상">화상</button>
        <button class="chip" data-value="방문+화상">방문+화상</button>
      </div>
    </div>
    <div class="filter-row" data-key="subject">
      <span class="filter-label">과목</span>
      <div class="chips">
        <button class="chip" data-value="">전체</button>
        <button class="chip" data-value="유아·아동">유아·아동</button>
        <button class="chip" data-value="국어">국어</button>
        <button class="chip" data-value="영어">영어</button>
        <button class="chip" data-value="수학">수학</button>
        <button class="chip" data-value="과학">과학</button>
        <button class="chip" data-value="사회">사회</button>
        <button class="chip" data-value="코딩">코딩</button>
      </div>
    </div>
    <div class="filter-row" data-key="region">
      <span class="filter-label">방문지역</span>
      <div class="chips">
        <button class="chip" data-value="">전체</button>
        <button class="chip" data-value="서울">서울</button>
        <button class="chip" data-value="경기">경기</button>
        <button class="chip" data-value="인천">인천</button>
        <button class="chip" data-value="부산">부산</button>
        <button class="chip" data-value="대구">대구</button>
        <button class="chip" data-value="대전">대전</button>
        <button class="chip" data-value="광주">광주</button>
        <button class="chip" data-value="울산">울산</button>
        <button class="chip" data-value="세종">세종</button>
        <button class="chip" data-value="강원">강원</button>
        <button class="chip" data-value="충북">충북</button>
        <button class="chip" data-value="충남">충남</button>
        <button class="chip" data-value="전북">전북</button>
        <button class="chip" data-value="전남">전남</button>
        <button class="chip" data-value="경북">경북</button>
        <button class="chip" data-value="경남">경남</button>
        <button class="chip" data-value="제주">제주</button>
      </div>
    </div>
    <div class="filter-row" data-key="gender">
      <span class="filter-label">성별</span>
      <div class="chips">
        <button class="chip" data-value="">전체</button>
        <button class="chip" data-value="여">여선생님</button>
        <button class="chip" data-value="남">남선생님</button>
      </div>
    </div>
  </div>

  <p class="tutor-count">선생님 <b id="tutor-count">0</b>명</p>

  <div class="tutors" id="tutor-list"></div>
  <p class="empty" id="tutor-empty">조건에 맞는 선생님이 없습니다. 조건을 바꾸거나 <a href="contact.html" style="color:var(--accent)">상담 신청</a>을 남겨 주세요.</p>
  <div style="text-align:center;margin-top:32px">
    <button class="btn btn-ghost" id="tutor-more" type="button">선생님 더 보기</button>
