<script>
  (function () {
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    document.getElementById('news-list').innerHTML = NEWS.map(function (n) {
      return '<a class="news-card" href="news/' + encodeURIComponent(n.file) + '">' +
        '<div class="news-meta"><span class="tag">' + esc(n.subject) + '</span><span>' + esc(n.region) + ' · ' + esc(n.school) + '</span><time>' + esc(n.date) + '</time></div>' +
        '<h2>' + esc(n.title) + '</h2>' +
        '<p>' + esc(n.summary) + '</p>' +
        '</a>';
    }).join('');
  })();
