  <div class="wrap nav">

    </nav>
    <a href="tel:01055773067" class="btn btn-accent">📞 전화상담</a>
  </div>
</header>

<main class="wrap">
  <div class="page-hero">
    <small>CONTACT</small>
    <h1>무료 상담 신청</h1>
    <p>남겨 주신 연락처로 24시간 안에 연락드립니다.</p>
  </div>

  <div class="cta-box" style="margin-bottom:80px">
    <div>
      <h2>딱 맞는 선생님을<br><em>찾아 드릴게요</em></h2>
      <p>학년과 희망 시간을 자세히 적어 주시면 더 빠르게 연결해 드립니다.</p>
      <div class="contact-info">
        <div><b>전화</b><a href="tel:01055773067" style="color:var(--accent);font-weight:700">010-5577-3067</a></div>
        <div><b>상담 시간</b><span>평일 10:00 ~ 21:00</span></div>
      </div>
    </div>
    <form id="contact-form" action="https://formspree.io/f/xbggglkp" method="POST">
      <input type="hidden" name="_subject" value="[과외블랙] 새 상담 신청">
      <input name="학생 이름" placeholder="학생 이름" required>
      <input name="연락처" type="tel" placeholder="연락처 (010-0000-0000)" required>
      <select name="학년" required>
        <option value="">학년</option>
        <option>초등</option><option>중1</option><option>중2</option><option>중3</option>
        <option>고1</option><option>고2</option><option>고3</option><option>N수생</option><option>성인</option>
      </select>
      <select name="희망 과목" required>
        <option value="">희망 과목</option>
        <option>수학</option><option>영어</option><option>국어</option>
        <option>과학</option><option>사회</option><option>코딩</option>
      </select>
      <input name="주소" placeholder="주소 (예: 서울 강남구 대치동) *" required minlength="5">
      <input name="아파트·건물명" placeholder="아파트·건물명 (예: OO아파트) *" required minlength="2">
      <input name="동·호수" placeholder="동·호수 (선택)">
      <textarea name="요청 사항" placeholder="희망 시간, 방문/화상 수업, 요청 사항"></textarea>
      <button class="btn btn-accent" type="submit">상담 신청하기</button>
      <p class="form-msg" id="form-msg"></p>
    </form>
  </div>
</main>
